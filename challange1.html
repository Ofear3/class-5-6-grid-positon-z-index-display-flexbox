<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid in CSS</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
            background: #f2f2f2;
            gap: 10px;
            padding: 10px;
        }

        /* ===== Header ===== */
        .header{
            background: #4CAF50;
            color: white;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
        }

        .nav{
            background: #2e7d32;
            padding: 8px 15px;
        }

        /* ===== Main Layout ===== */
        .main{
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 15px;
            height: 100%;
        }

        /* ===== Sidebar ===== */
        .sidebar{
            background: #ffcc80;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        /* ===== Right Content ===== */
        .content{
            display: grid;
            grid-template-rows: auto 1fr 1fr;
            gap: 10px;
            height: 100%;
        }

        .title{
            text-align: center;
            font-size: 22px;
        }

        /* ===== Top row ===== */
        .top-content{
            display: grid;
            grid-template-columns: 1fr 1fr ;
            gap: 15px;
        }

        .section{
            background: #90caf9;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        .article{
            background: #ce93d8;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        /* ===== Bottom row ===== */
        .bottom-content{
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .image-section{
            background: #a5d6a7;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        .project-section{
            background: #ffab91;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        /* ===== Footer ===== */
        .footer{
            background: #333;
            color: white;
            text-align: center;
            padding: 12px;
        }
    </style>

</head>
<body>

    <header class="header">
        <h3>&lt; header &gt;</h3>
        <nav class="nav">&lt; nav &gt;</nav>
    </header>

    <main class="main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Sidebar</h3>
        </aside>

        <!-- Content -->
        <div class="content">
            <h1 class="title">Challenge 1 || Layout of a Webpage</h1>

            <div class="top-content">
                <section class="section">
                    &lt; section &gt;
                </section>

                <article class="article">
                    &lt; article &gt;
                </article>
            </div>

            <div class="bottom-content">
                <div class="image-section">
                    Image Section
                </div>

                <div class="project-section">
                    Project Section
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&lt; footer &gt;</p>
    </footer>

</body>
</html>
