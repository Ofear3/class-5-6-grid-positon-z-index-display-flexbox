<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>


        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background-color: rgb(242, 236, 228);
        }

        .dashboard-box{
            display:grid;
            grid-template-rows: 60px 1fr;
            grid-template-columns: 200px 1fr;
            grid-template-areas:"sidebar header"
                                 "sidebar main"
                                 "footer footer";
            min-height: 100vh;                    
        }

/* ==========SIDE BAR STYLING==========*/
        .sidebar{
            grid-area: sidebar;
            background-color: rgb(136, 136, 189);
            color:white;
            padding:20px;
            display:flex;
            flex-direction: column;
            gap:20px;
        }

        .dashboard{
            font-size:22px;
            font-weight: 700;
            text-align: center;
        }

        .menu{
            display:flex;
            flex-direction: column;
            gap:15px;
            font-size: 20px;
            font-weight: 500;
        }

        .menu a{
            text-decoration: none;
            color: bisque;
            padding: 10px;
            border-radius: 6px;
        }

        .menu a:hover{
            background: rgb(91, 91, 145);
        }

/* ==========Header STYLING==========*/   
        .header{
            grid-area:header;
            background-color: #20263e;
            display:flex;
            flex-direction: row;
            position:sticky;
            top:0px;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header input{
            padding:8px 12px;
            width: 100px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }

        .profile{
            display:flex;
            align-items: center;
            gap:15px;
        }

        .profile span{
            color:rgb(120, 157, 235);
            font-weight: 600;
        }

        .profile img{
            height: 50px;
            width: 50px;
            border: 2px rgb(113, 250, 0) solid;
            border-radius: 50%;
        }

/* ==========Main STYLING==========*/  
    .main {
      grid-area: main;
      padding: 35px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Stats Cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.9 ease;
    }

    .card:hover{
        transform: scale(1.1);
    }

    .card h3 {
      font-size: 14px;
      color: #64748b;
    }

    .card p {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
    }

/* ==========Footer STYLING==========*/     
    .footer{
        grid-area:footer;
        text-align: center;
        justify-content: center;
        padding:15px;
        background-color: #20263e;
    }
    .footer p{
        color:	#aaaaaa;
        font-weight:500;
    }



/* ==========ADDing Media Query for Responsive==========*/

    @media (max-width:576px) {

        .dashboard-box{
            grid-template-rows: 60px auto 1fr auto;
            grid-template-columns: 1fr;
            grid-template-areas:"header"
                                 "sidebar"
                                 "main"
                                 "footer";
            min-height: 100vh;                    
        }

    .header{
        display:flex;
        flex-direction: row;
    }
        
    .header input{
        width: 140px;
        } 
        
    .sidebar{
        flex-direction: column;
        justify-content: space-around;
        } 
    
    .menu{
        padding:0;
        flex-direction: row;
        font-size: 12px;
        justify-content: center;
    }   
        
    }



    @media (min-width:992px) {
    .stats {
      grid-template-columns: repeat(2,1fr);
      gap: 20px;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.9 ease;
      width: 500px;
    }

    .header input{
        padding:8px 12px;
        width: 200px;
        border: 2px solid #ccc;
        border-radius: 4px;
        }    
    }
    </style>



</head>
<body>
    

    <div class="dashboard-box">

    <aside class="sidebar">
        <div class="dashboard">
            My Dashboard
        </div>
        <nav class="menu">
            <a href="challange2.html">Dashboard</a>
            <a href="challange3.html">Price Cards</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </nav>
    </aside>


    <header class="header">
        <input type="text" placeholder="Search....">
        <div class="profile">
            <span>Admin Name</span>
            <img src="https://i.pravatar.cc/100" alt="profile pic">
        </div>
    </header>




 <!-- ==========Main Content==========  -->
    <main class="main">

      <div class="stats">
        <div class="card">
          <h3>Total Users</h3>
          <p>1,245</p>
        </div>
        <div class="card">
          <h3>Revenue</h3>
          <p>$8,560</p>
        </div>
        <div class="card">
          <h3>Orders</h3>
          <p>320</p>
        </div>
        <div class="card">
          <h3>Visitors</h3>
          <p>9,120</p>
        </div>
      </div>

    </main>
    
    <footer class="footer">
        <p>
            &copy; 2026 Mohammad Saif. All Rights Reserved.
        </p>
    </footer>

  </div>  
</body>
</html>
